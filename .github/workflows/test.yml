name: voice-mcp checks

on:
  push:
    branches: [zeabur, voice-v1.3-quality]
  pull_request:
    branches: [zeabur]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/zeabur-server.mjs
          node --check src/performance.mjs
          node --check src/drama-timeline.mjs
          node --check src/drama-preview.mjs
      - name: Regression tests
        run: npm test
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-package-lock --no-audit --no-fund
      - name: Runtime smoke test
        shell: bash
        run: |
          PORT=8765 node src/zeabur-server.mjs > /tmp/voice-mcp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/status > /tmp/voice-status.json; then
              break
            fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const status = JSON.parse(fs.readFileSync("/tmp/voice-status.json", "utf8"));
            assert.equal(status.status, "ok");
            assert.equal(status.version, "1.4.0-beta.2");
            assert.equal(status.features.request_id_continuity, true);
            assert.equal(status.features.language_auto_detection, true);
            assert.equal(status.features.local_drama_preview, true);
          '
          curl -fsS -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"voice-mcp-ci","version":"1.0.0"}}}' \
            > /tmp/mcp-initialize.json
          curl -fsS http://127.0.0.1:8765/drama-preview -o /tmp/drama-preview.html
          grep -q 'Shin · Private Drama' /tmp/drama-preview.html
          curl -fsS http://127.0.0.1:8765/drama/timeline.mjs -o /tmp/drama-timeline.mjs
          grep -q 'createDramaTimeline' /tmp/drama-timeline.mjs
          STATUS=$(curl -s -o /tmp/drama-bad-request.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8765/speak \
            -H 'Content-Type: application/json' -d '{"text":""}')
          test "$STATUS" = "400"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const init = JSON.parse(fs.readFileSync("/tmp/mcp-initialize.json", "utf8"));
            assert.equal(init.result.serverInfo.name, "voice-mcp");
            assert.ok(init.result.capabilities);
          '
