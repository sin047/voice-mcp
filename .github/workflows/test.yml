name: voice-mcp checks

on:
  push:
    branches: [zeabur, voice-v1.3-quality]
  pull_request:
    branches: [zeabur]

concurrency:
  group: voice-mcp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check src/server.mjs
          node --check src/performance.mjs
          node --check src/drama-timeline.mjs
          node --check src/drama-preview.mjs
          node --check src/recordings-preview.mjs
          node --check src/http-auth.mjs
          node --check src/usage-guard.mjs
          node --check src/audio-assets.mjs
          node --check src/wav-audio.mjs
          node --check src/soundscape-presets.mjs
      - name: Regression tests
        run: npm test
      - name: Install runtime dependencies
        run: npm install --omit=dev --no-package-lock --no-audit --no-fund
      - name: Runtime smoke test
        shell: bash
        run: |
          TEST_ACCESS_TOKEN="ci-only-private-drama-token-0123456789abcdef"
          PRIVATE_DRAMA_ACCESS_TOKEN="$TEST_ACCESS_TOKEN" MCP_PUBLIC_BASE_URL="https://voice.example.test" AUDIO_ASSET_DIR="/tmp/voice-mcp-assets" RECORDING_DIR="/tmp/voice-mcp-recordings" MCP_SOUNDSCAPE_TOOLS_ENABLED=true MCP_MAX_REQUESTS_PER_MINUTE=3 HOST=127.0.0.1 PORT=8765 node src/server.mjs > /tmp/voice-mcp.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/status > /tmp/voice-status.json; then
              break
            fi
            sleep 1
          done
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const status = JSON.parse(fs.readFileSync("/tmp/voice-status.json", "utf8"));
            assert.equal(status.status, "ok");
            assert.equal(status.version, "1.4.0-beta.17");
            assert.equal(status.features.request_id_continuity, true);
            assert.equal(status.features.language_auto_detection, true);
            assert.equal(status.features.local_drama_preview, true);
            assert.equal(status.features.private_audio_asset_library, true);
            assert.equal(status.features.persistent_recording_archive, true);
            assert.equal(status.features.speak_with_soundscape, true);
            assert.equal(status.features.soundscape_mcp_enabled, true);
            const ui = status.features.mcp_apps_audio_player;
            assert.equal(ui, true);
          '
          curl -fsS -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"voice-mcp-ci","version":"1.0.0"}}}' \
            > /tmp/mcp-initialize.json
          curl -fsS -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            > /tmp/mcp-tools.json
          curl -fsS -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":3,"method":"resources/read","params":{"uri":"ui://voice-mcp/player.html"}}' \
            > /tmp/mcp-player.json
          MCP_THROTTLED=$(curl -s -o /tmp/mcp-throttled.json -w '%{http_code}' -X POST http://127.0.0.1:8765/mcp \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d '{"jsonrpc":"2.0","id":4,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"voice-mcp-ci","version":"1.0.0"}}}')
          test "$MCP_THROTTLED" = "429"
          ASSETS_UNAUTH=$(curl -s -o /tmp/assets-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/assets)
          test "$ASSETS_UNAUTH" = "401"
          node --input-type=module -e '
            import fs from "node:fs";
            import { encodePcm16Wav } from "./src/wav-audio.mjs";
            fs.writeFileSync("/tmp/ci-audio.wav", encodePcm16Wav([new Float32Array(4410).fill(0.1)], 44100));
          '
          ASSET_UPLOAD=$(curl -s -o /tmp/asset-upload.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X POST http://127.0.0.1:8765/assets -H 'Content-Type: audio/wav' -H 'X-Asset-Name: ci-test.wav' -H 'X-Asset-Kind: foley' --data-binary @/tmp/ci-audio.wav)
          test "$ASSET_UPLOAD" = "201"
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/assets -o /tmp/assets-list.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const payload = JSON.parse(fs.readFileSync("/tmp/assets-list.json", "utf8"));
            assert.equal(payload.assets.length, 1);
            assert.match(payload.assets[0].id, /^fx_/);
            assert.equal(payload.assets[0].name, "ci-test.wav");
          '
          ASSET_ID=$(node --input-type=module -e 'import fs from "node:fs"; const payload=JSON.parse(fs.readFileSync("/tmp/assets-list.json","utf8")); process.stdout.write(payload.assets[0].id);')
          ASSET_DELETE=$(curl -s -o /tmp/asset-delete.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X DELETE "http://127.0.0.1:8765/assets/$ASSET_ID")
          test "$ASSET_DELETE" = "204"

          RECORDINGS_UNAUTH=$(curl -s -o /tmp/recordings-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/recordings)
          test "$RECORDINGS_UNAUTH" = "401"
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/recordings -o /tmp/recordings-list.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const payload = JSON.parse(fs.readFileSync("/tmp/recordings-list.json", "utf8"));
            assert.equal(payload.recordings.length, 0);
            assert.equal(payload.usage.recordingCount, 0);
          '
          RECORDING_UPLOAD=$(curl -s -o /tmp/recording-upload.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X POST http://127.0.0.1:8765/recordings -H 'Content-Type: audio/wav' -H 'X-Recording-Text: CI recording' --data-binary @/tmp/ci-audio.wav)
          test "$RECORDING_UPLOAD" = "201"
          RECORDING_ID=$(node --input-type=module -e 'import fs from "node:fs"; const payload=JSON.parse(fs.readFileSync("/tmp/recording-upload.json","utf8")); process.stdout.write(payload.recording.id);')
          RECORDING_PATCH_UNAUTH=$(curl -s -o /tmp/recording-patch-unauthorized.json -w '%{http_code}' -X PATCH "http://127.0.0.1:8765/recordings/$RECORDING_ID" -H 'Content-Type: application/json' -d '{"favorite":true}')
          test "$RECORDING_PATCH_UNAUTH" = "401"
          RECORDING_PATCH=$(curl -s -o /tmp/recording-patch.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X PATCH "http://127.0.0.1:8765/recordings/$RECORDING_ID" -H 'Content-Type: application/json' -d '{"title":"CI favorite","tags":["ci","test"],"favorite":true}')
          test "$RECORDING_PATCH" = "200"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const payload = JSON.parse(fs.readFileSync("/tmp/recording-patch.json", "utf8"));
            assert.equal(payload.recording.title, "CI favorite");
            assert.deepEqual(payload.recording.tags, ["ci", "test"]);
            assert.equal(payload.recording.favorite, true);
          '
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/recordings -o /tmp/recordings-list-updated.json
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const payload = JSON.parse(fs.readFileSync("/tmp/recordings-list-updated.json", "utf8"));
            assert.equal(payload.recordings.length, 1);
            assert.equal(payload.recordings[0].title, "CI favorite");
            assert.equal(payload.recordings[0].favorite, true);
          '
          RECORDING_DELETE=$(curl -s -o /tmp/recording-delete.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X DELETE "http://127.0.0.1:8765/recordings/$RECORDING_ID")
          test "$RECORDING_DELETE" = "204"
          RECORDINGS_PAGE_UNAUTH=$(curl -s -o /tmp/recordings-page-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/recordings-library)
          test "$RECORDINGS_PAGE_UNAUTH" = "401"
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/recordings-library -o /tmp/recordings-page.html
          grep -q 'Shin · Recordings' /tmp/recordings-page.html
          grep -q '下载 WAV' /tmp/recordings-page.html
          grep -q '删除' /tmp/recordings-page.html
          PREVIEW_UNAUTH=$(curl -s -o /tmp/drama-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/drama-preview)
          test "$PREVIEW_UNAUTH" = "401"
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/drama-preview -o /tmp/drama-preview.html
          grep -q 'Shin · Private Drama' /tmp/drama-preview.html
          TIMELINE_UNAUTH=$(curl -s -o /tmp/timeline-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/drama/timeline.mjs)
          test "$TIMELINE_UNAUTH" = "401"
          curl -fsS -u "voice-mcp:$TEST_ACCESS_TOKEN" http://127.0.0.1:8765/drama/timeline.mjs -o /tmp/drama-timeline.mjs
          grep -q 'createDramaTimeline' /tmp/drama-timeline.mjs
          PANEL_UNAUTH=$(curl -s -o /tmp/panel-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/panel)
          test "$PANEL_UNAUTH" = "401"
          EVENTS_UNAUTH=$(curl -s -o /tmp/events-unauthorized.json -w '%{http_code}' http://127.0.0.1:8765/events/latest)
          test "$EVENTS_UNAUTH" = "401"
          SPEAK_UNAUTH=$(curl -s -o /tmp/speak-unauthorized.json -w '%{http_code}' -X POST http://127.0.0.1:8765/speak -H 'Content-Type: application/json' -d '{"text":"test"}')
          test "$SPEAK_UNAUTH" = "401"
          SPEAK_AUTH=$(curl -s -o /tmp/speak-bad-request.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" -X POST http://127.0.0.1:8765/speak -H 'Content-Type: application/json' -d '{"text":""}')
          test "$SPEAK_AUTH" = "400"
          SPEAK_GET_UNAUTH=$(curl -s -o /tmp/speak-get-unauthorized.json -w '%{http_code}' 'http://127.0.0.1:8765/speak?text=test')
          test "$SPEAK_GET_UNAUTH" = "401"
          SPEAK_GET_AUTH=$(curl -s -o /tmp/speak-get-bad-request.json -w '%{http_code}' -u "voice-mcp:$TEST_ACCESS_TOKEN" 'http://127.0.0.1:8765/speak?text=')
          test "$SPEAK_GET_AUTH" = "400"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const init = JSON.parse(fs.readFileSync("/tmp/mcp-initialize.json", "utf8"));
            assert.equal(init.result.serverInfo.name, "voice-mcp");
            assert.ok(init.result.capabilities);
          '
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const tools = JSON.parse(fs.readFileSync("/tmp/mcp-tools.json", "utf8")).result.tools;
            const names = tools.map((tool) => tool.name);
            assert.ok(names.includes("speak"));
            assert.ok(names.includes("list_sound_assets"));
            assert.ok(names.includes("speak_with_soundscape"));
            const speak = tools.find((tool) => tool.name === "speak");
            const soundscape = tools.find((tool) => tool.name === "speak_with_soundscape");
            assert.equal(speak._meta.ui.resourceUri, "ui://voice-mcp/player.html");
            assert.equal(soundscape._meta.ui.resourceUri, "ui://voice-mcp/player.html");
            const caps = JSON.parse(fs.readFileSync("/tmp/mcp-initialize.json", "utf8")).result.capabilities;
            assert.deepEqual(caps.extensions["io.modelcontextprotocol/ui"].mimeTypes, ["text/html;profile=mcp-app"]);
            const resource = JSON.parse(fs.readFileSync("/tmp/mcp-player.json", "utf8")).result.contents[0];
            assert.equal(resource.mimeType, "text/html;profile=mcp-app");
            assert.match(resource.text, /appInfo/);
            assert.match(resource.text, /protocolVersion:"2026-01-26"/);
            assert.match(resource.text, /audio id="audio" controls/);
          '
